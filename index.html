<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Agenda | Minimalist Workspace</title>
    <meta name="description" content="Unified workspace for tasks, scheduling agenda, and freelance projects." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('agenda_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          // Remove any legacy bitmap zoom if present
          if ('zoom' in document.documentElement.style) {
            document.documentElement.style.removeProperty('zoom');
          }
          var scale = localStorage.getItem('agenda_ui_scale');
          if (scale) {
            var val = parseInt(scale, 10);
            if (!isNaN(val) && val >= 85 && val <= 140 && val !== 100) {
              document.documentElement.style.fontSize = val + '%';
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 selection:bg-zinc-800 selection:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
